name: reusable sonarqube scan

on:
  workflow_call:
    inputs:
      project_key: { required: true, type: string }
      branch_name: { required: true, type: string }
      dotnet_solution: { required: true, type: string }
      checkout_ref: { required: false, type: string, default: "" }
      branch_analysis_enabled: { required: false, type: boolean, default: true }
    outputs:
      quality_gate:
        value: ${{ jobs.sonar.outputs.quality_gate }}
      dashboard_url:
        value: ${{ jobs.sonar.outputs.dashboard_url }}
    secrets:
      SONAR_HOST_URL: { required: true }
      SONAR_TOKEN: { required: true }
      NUGET_USERNAME: { required: false }
      NUGET_PASSWORD: { required: false }

jobs:
  sonar:
    runs-on: self-hosted
    outputs:
      quality_gate: ${{ steps.gate.outputs.quality_gate }}
      dashboard_url: ${{ steps.meta.outputs.dashboard_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install scanner
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
          NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
        run: |
          set -euo pipefail
          scanner_config="NuGet.config"
          if [ -f NuGet.config ]; then
            cp NuGet.config .sonar-nuget.config
            if [ -n "${NUGET_USERNAME:-}" ] && [ -n "${NUGET_PASSWORD:-}" ]; then
              sed -i \
                -e "s|%NUGET_USERNAME%|${NUGET_USERNAME}|g" \
                -e "s|%NUGET_PASSWORD%|${NUGET_PASSWORD}|g" \
                .sonar-nuget.config
            fi
            scanner_config=".sonar-nuget.config"
          fi
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet tool update --global dotnet-sonarscanner --configfile "$scanner_config" \
            || dotnet tool install --global dotnet-sonarscanner --configfile "$scanner_config"
      - name: Begin analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_ANALYSIS_ENABLED: ${{ inputs.branch_analysis_enabled }}
        run: |
          args=(
            /k:"${{ inputs.project_key }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true
          )
          if [ "${BRANCH_ANALYSIS_ENABLED}" = "true" ]; then
            args+=(/d:sonar.branch.name="${{ inputs.branch_name }}")
          fi
          dotnet sonarscanner begin "${args[@]}"
      - name: Build for analysis
        run: dotnet build "${{ inputs.dotnet_solution }}" --configuration Release
      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
      - id: gate
        name: Validate Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          branch_query=""
          if [ "${{ inputs.branch_analysis_enabled }}" = "true" ]; then
            branch_query="&branch=${{ inputs.branch_name }}"
          fi
          status=$(curl -fsS -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${{ inputs.project_key }}${branch_query}" | jq -r '.projectStatus.status')
          echo "quality_gate=${status}" >> "$GITHUB_OUTPUT"
          test "$status" = "OK"
      - id: meta
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          branch_query=""
          if [ "${{ inputs.branch_analysis_enabled }}" = "true" ]; then
            branch_query="&branch=${{ inputs.branch_name }}"
          fi
          echo "dashboard_url=${SONAR_HOST_URL}/dashboard?id=${{ inputs.project_key }}${branch_query}" >> "$GITHUB_OUTPUT"
