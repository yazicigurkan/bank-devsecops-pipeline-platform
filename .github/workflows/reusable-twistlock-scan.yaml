name: reusable twistlock scan

on:
  workflow_call:
    inputs:
      image_reference: { required: false, type: string, default: "" }
      image_tar_artifact: { required: true, type: string }
      harbor_registry: { required: false, type: string, default: "" }
      harbor_project: { required: false, type: string, default: "" }
      image_name: { required: false, type: string, default: "" }
      image_tag: { required: false, type: string, default: "" }
      environment: { required: true, type: string }
      fail_on_high: { required: false, type: boolean, default: true }
    outputs:
      scan_id:
        value: ${{ jobs.scan.outputs.scan_id }}
      report_url:
        value: ${{ jobs.scan.outputs.report_url }}
      critical:
        value: ${{ jobs.scan.outputs.critical }}
      high:
        value: ${{ jobs.scan.outputs.high }}
    secrets:
      TWISTLOCK_CONSOLE_URL: { required: true }
      TWISTLOCK_USER: { required: true }
      TWISTLOCK_PASSWORD: { required: true }

jobs:
  scan:
    runs-on: self-hosted
    outputs:
      scan_id: ${{ steps.scanmeta.outputs.scan_id }}
      report_url: ${{ steps.policy.outputs.report_url }}
      critical: ${{ steps.policy.outputs.critical }}
      high: ${{ steps.policy.outputs.high }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_tar_artifact }}
      - name: Load image
        run: docker load -i image.tar
      - id: image
        name: Resolve image reference
        run: |
          set -euo pipefail
          image_reference="${{ inputs.image_reference }}"
          if [ -z "$image_reference" ]; then
            image_reference="${{ inputs.harbor_registry }}/${{ inputs.harbor_project }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          fi
          if [ -z "$image_reference" ] || [ "$image_reference" = "//:" ]; then
            echo "image reference is required" >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
      - id: policy
        uses: yazicigurkan/bank-devsecops-pipeline-platform/actions/twistlock-policy-check@v1.0.20
        with:
          console_url: ${{ secrets.TWISTLOCK_CONSOLE_URL }}
          username: ${{ secrets.TWISTLOCK_USER }}
          password: ${{ secrets.TWISTLOCK_PASSWORD }}
          image_reference: ${{ steps.image.outputs.image_reference }}
          environment: ${{ inputs.environment }}
          fail_on_high: ${{ inputs.fail_on_high }}
      - id: scanmeta
        name: Normalize scan metadata
        run: |
          set -euo pipefail
          echo "scan_id=twistlock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
