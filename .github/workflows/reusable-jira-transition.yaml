name: reusable jira transition

on:
  workflow_call:
    inputs:
      jira_issue_key: { required: true, type: string }
      transition_name: { required: true, type: string }
      comment: { required: true, type: string }
    secrets:
      JIRA_BASE_URL: { required: true }
      JIRA_USER_EMAIL: { required: true }
      JIRA_API_TOKEN: { required: true }

jobs:
  transition:
    runs-on: self-hosted
    steps:
      - name: Add comment and transition
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          jq -n --arg body "${{ inputs.comment }}" \
            '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$body}]}]}}' \
            > jira-comment.json
          curl -fsS -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d @jira-comment.json \
            "${JIRA_BASE_URL}/rest/api/3/issue/${{ inputs.jira_issue_key }}/comment"
          curl -fsS -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${{ inputs.jira_issue_key }}/transitions" \
            -o transitions.json
          transition_id=$(jq -r --arg name "${{ inputs.transition_name }}" '.transitions[] | select(.name == $name) | .id' transitions.json | head -1)
          if [ -z "$transition_id" ]; then
            echo "Transition not found: ${{ inputs.transition_name }}" >&2
            exit 1
          fi
          jq -n --arg id "$transition_id" '{transition:{id:$id}}' > transition.json
          curl -fsS -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d @transition.json \
            "${JIRA_BASE_URL}/rest/api/3/issue/${{ inputs.jira_issue_key }}/transitions"
