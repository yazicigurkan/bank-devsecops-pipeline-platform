name: dotnet Jira TEST release orchestration

on:
  workflow_call:
    inputs:
      jira_issue_key: { required: true, type: string }
      application_name: { required: true, type: string }
      repository_name: { required: true, type: string }
      branch_name: { required: true, type: string }
      release_version: { required: true, type: string }
      deployment_type: { required: true, type: string }
      target_environment: { required: true, type: string }
      dotnet_solution: { required: true, type: string }
      project_path: { required: true, type: string }
      test_project_path: { required: true, type: string }
      sonar_project_key: { required: true, type: string }
      sonar_branch_analysis_enabled: { required: false, type: boolean, default: true }
      graphnode_project_key: { required: true, type: string }
      nexus_repository: { required: true, type: string }
      harbor_registry: { required: false, type: string, default: "" }
      harbor_project: { required: false, type: string, default: "" }
      image_name: { required: false, type: string, default: "" }
      k8s_namespace: { required: false, type: string, default: "" }
      helm_chart_path: { required: false, type: string, default: "" }
      helm_values_file: { required: false, type: string, default: "" }
      iis_server_group: { required: false, type: string, default: "" }
      iis_site_name: { required: false, type: string, default: "" }
      iis_app_pool_name: { required: false, type: string, default: "" }
      deploy_path: { required: false, type: string, default: "" }
      health_check_url: { required: true, type: string }
permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  input_guard:
    runs-on: self-hosted
    steps:
      - name: Validate TEST release inputs
        run: |
          set -euo pipefail
          [ "${{ inputs.branch_name }}" = "TEST" ]
          [ "${{ inputs.target_environment }}" = "TEST" ]
          case "${{ inputs.deployment_type }}" in
            iis|kubernetes) ;;
            *) echo "Unsupported deployment_type=${{ inputs.deployment_type }}" >&2; exit 1 ;;
          esac

  jira_validate:
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-jira-validation.yaml@v1.0.18
    needs: input_guard
    with:
      jira_issue_key: ${{ inputs.jira_issue_key }}
      target_environment: TEST
      allowed_statuses: "TEST Deploy,TEST Deploy Approved"
      required_approvals: "manager,test-lead"
    secrets: inherit

  build:
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-dotnet-build.yaml@v1.0.18
    needs: jira_validate
    with:
      dotnet_solution: ${{ inputs.dotnet_solution }}
      project_path: ${{ inputs.project_path }}
      test_project_path: ${{ inputs.test_project_path }}
      configuration: Release
      artifact_name: ${{ inputs.application_name }}-package
      checkout_ref: ${{ inputs.branch_name }}
    secrets: inherit

  sonar:
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-sonarqube-scan.yaml@v1.0.18
    needs: build
    with:
      project_key: ${{ inputs.sonar_project_key }}
      branch_name: TEST
      dotnet_solution: ${{ inputs.dotnet_solution }}
      checkout_ref: ${{ inputs.branch_name }}
      branch_analysis_enabled: ${{ inputs.sonar_branch_analysis_enabled }}
    secrets: inherit

  graphnode:
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-graphnode-sast.yaml@v1.0.18
    needs: sonar
    with:
      project_key: ${{ inputs.graphnode_project_key }}
      repository: ${{ inputs.repository_name }}
      branch: TEST
      environment: TEST
      jira_issue_key: ${{ inputs.jira_issue_key }}
      fail_on_high: true
      checkout_ref: ${{ inputs.branch_name }}
    secrets: inherit

  nexus_publish:
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-nexus-publish.yaml@v1.0.18
    needs: graphnode
    with:
      application_name: ${{ inputs.application_name }}
      environment: TEST
      release_version: ${{ inputs.release_version }}
      nexus_repository: ${{ inputs.nexus_repository }}
      artifact_name: ${{ inputs.application_name }}-package
    secrets: inherit

  docker_build:
    if: ${{ inputs.deployment_type == 'kubernetes' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-docker-build.yaml@v1.0.18
    needs: graphnode
    with:
      application_name: ${{ inputs.application_name }}
      environment: TEST
      release_version: ${{ inputs.release_version }}
      harbor_registry: ${{ inputs.harbor_registry }}
      image_name: ${{ inputs.image_name }}
      harbor_project: ${{ inputs.harbor_project }}
      checkout_ref: ${{ inputs.branch_name }}
    secrets: inherit

  twistlock:
    if: ${{ inputs.deployment_type == 'kubernetes' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-twistlock-scan.yaml@v1.0.18
    needs: docker_build
    with:
      image_reference: ${{ needs.docker_build.outputs.image_reference }}
      image_tar_artifact: ${{ needs.docker_build.outputs.image_tar_artifact }}
      harbor_registry: ${{ inputs.harbor_registry }}
      harbor_project: ${{ inputs.harbor_project }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ needs.docker_build.outputs.image_tag }}
      environment: TEST
      fail_on_high: true
    secrets: inherit

  harbor_push:
    if: ${{ inputs.deployment_type == 'kubernetes' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-harbor-push.yaml@v1.0.18
    needs: [docker_build, twistlock]
    with:
      image_reference: ${{ needs.docker_build.outputs.image_reference }}
      image_tar_artifact: ${{ needs.docker_build.outputs.image_tar_artifact }}
      harbor_registry: ${{ inputs.harbor_registry }}
      harbor_project: ${{ inputs.harbor_project }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ needs.docker_build.outputs.image_tag }}
    secrets: inherit

  gitops_update:
    if: ${{ inputs.deployment_type == 'kubernetes' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-argocd-gitops-update.yaml@v1.0.18
    needs: [harbor_push, nexus_publish]
    with:
      application_name: ${{ inputs.application_name }}
      environment: TEST
      target_branch: ${{ inputs.branch_name }}
      values_file: ${{ inputs.helm_values_file }}
      image_repository: ${{ format('{0}/{1}/{2}', inputs.harbor_registry, inputs.harbor_project, inputs.image_name) }}
      image_tag: ${{ needs.harbor_push.outputs.image_tag }}
      image_digest: ${{ needs.harbor_push.outputs.image_digest }}
      argocd_application: ${{ format('{0}-test', inputs.application_name) }}
    secrets: inherit

  iis_deploy:
    if: ${{ inputs.deployment_type == 'iis' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-iis-deploy.yaml@v1.0.18
    needs: nexus_publish
    with:
      application_name: ${{ inputs.application_name }}
      environment: TEST
      artifact_version: ${{ needs.nexus_publish.outputs.artifact_version }}
      nexus_artifact_url: ${{ needs.nexus_publish.outputs.artifact_url }}
      iis_server_group: ${{ inputs.iis_server_group }}
      iis_site_name: ${{ inputs.iis_site_name }}
      iis_app_pool_name: ${{ inputs.iis_app_pool_name }}
      deploy_path: ${{ inputs.deploy_path }}
      health_check_url: ${{ inputs.health_check_url }}
      rollback_enabled: true
    secrets: inherit

  jira_transition:
    if: ${{ always() && !cancelled() && (needs.publish_evidence_k8s.result == 'success' || needs.publish_evidence_iis.result == 'success') }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-jira-transition.yaml@v1.0.18
    needs: [publish_evidence_k8s, publish_evidence_iis]
    with:
      jira_issue_key: ${{ inputs.jira_issue_key }}
      transition_name: "Test Ortam Kontrolleri"
      comment: "TEST deploy completed for ${{ inputs.application_name }} ${{ inputs.release_version }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit

  publish_evidence_k8s:
    if: ${{ inputs.deployment_type == 'kubernetes' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-release-evidence-publish.yaml@v1.0.18
    needs: [jira_validate, sonar, graphnode, nexus_publish, docker_build, twistlock, harbor_push, gitops_update]
    with:
      application_name: ${{ inputs.application_name }}
      release_version: ${{ inputs.release_version }}
      environment: TEST
      deployment_type: kubernetes
      jira_issue_key: ${{ inputs.jira_issue_key }}
      artifact_url: ${{ needs.nexus_publish.outputs.artifact_url }}
      artifact_version: ${{ needs.nexus_publish.outputs.artifact_version }}
      image_reference: ${{ needs.docker_build.outputs.image_reference }}
      image_tag: ${{ needs.harbor_push.outputs.image_tag }}
      image_digest: ${{ needs.harbor_push.outputs.image_digest }}
      sonar_quality_gate: ${{ needs.sonar.outputs.quality_gate == 'OK' && 'PASSED' || needs.sonar.outputs.quality_gate }}
      sonar_dashboard_url: ${{ needs.sonar.outputs.dashboard_url }}
      graphnode_scan_id: ${{ needs.graphnode.outputs.scan_id }}
      graphnode_report_url: ${{ needs.graphnode.outputs.report_url }}
      graphnode_critical: ${{ needs.graphnode.outputs.critical }}
      graphnode_high: ${{ needs.graphnode.outputs.high }}
      graphnode_medium: ${{ needs.graphnode.outputs.medium }}
      graphnode_low: ${{ needs.graphnode.outputs.low }}
      twistlock_scan_id: ${{ needs.twistlock.outputs.scan_id }}
      twistlock_report_url: ${{ needs.twistlock.outputs.report_url }}
      twistlock_critical: ${{ needs.twistlock.outputs.critical }}
      twistlock_high: ${{ needs.twistlock.outputs.high }}
      approved_by: ${{ needs.jira_validate.outputs.approved_by }}
      test_approved_by: test-lead
    secrets: inherit

  publish_evidence_iis:
    if: ${{ inputs.deployment_type == 'iis' }}
    uses: yazicigurkan/bank-devsecops-pipeline-platform/.github/workflows/reusable-release-evidence-publish.yaml@v1.0.18
    needs: [jira_validate, sonar, graphnode, nexus_publish, iis_deploy]
    with:
      application_name: ${{ inputs.application_name }}
      release_version: ${{ inputs.release_version }}
      environment: TEST
      deployment_type: iis
      jira_issue_key: ${{ inputs.jira_issue_key }}
      artifact_url: ${{ needs.nexus_publish.outputs.artifact_url }}
      artifact_version: ${{ needs.nexus_publish.outputs.artifact_version }}
      sonar_quality_gate: ${{ needs.sonar.outputs.quality_gate == 'OK' && 'PASSED' || needs.sonar.outputs.quality_gate }}
      sonar_dashboard_url: ${{ needs.sonar.outputs.dashboard_url }}
      graphnode_scan_id: ${{ needs.graphnode.outputs.scan_id }}
      graphnode_report_url: ${{ needs.graphnode.outputs.report_url }}
      graphnode_critical: ${{ needs.graphnode.outputs.critical }}
      graphnode_high: ${{ needs.graphnode.outputs.high }}
      graphnode_medium: ${{ needs.graphnode.outputs.medium }}
      graphnode_low: ${{ needs.graphnode.outputs.low }}
      approved_by: ${{ needs.jira_validate.outputs.approved_by }}
      test_approved_by: test-lead
    secrets: inherit
