name: reusable harbor push

on:
  workflow_call:
    inputs:
      image_reference: { required: false, type: string, default: "" }
      image_tar_artifact: { required: true, type: string }
      harbor_registry: { required: false, type: string, default: "" }
      harbor_project: { required: false, type: string, default: "" }
      image_name: { required: false, type: string, default: "" }
      image_tag: { required: false, type: string, default: "" }
    outputs:
      image_tag:
        value: ${{ jobs.push.outputs.image_tag }}
      image_digest:
        value: ${{ jobs.push.outputs.image_digest }}
    secrets:
      HARBOR_REGISTRY: { required: true }
      HARBOR_USERNAME: { required: true }
      HARBOR_PASSWORD: { required: true }

jobs:
  push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_tar_artifact }}
      - run: docker load -i image.tar
      - id: image
        name: Resolve image reference
        run: |
          set -euo pipefail
          image_reference="${{ inputs.image_reference }}"
          if [ -z "$image_reference" ]; then
            image_reference="${{ inputs.harbor_registry }}/${{ inputs.harbor_project }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          fi
          if [ -z "$image_reference" ] || [ "$image_reference" = "//:" ]; then
            echo "image reference is required" >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
      - name: Login
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
      - name: Push
        run: docker push "${{ steps.image.outputs.image_reference }}"
      - id: meta
        run: |
          echo "image_tag=${{ steps.image.outputs.image_reference }}" | awk -F: '{print "image_tag="$NF}' >> "$GITHUB_OUTPUT"
      - id: digest
        run: |
          set -euo pipefail
          repo_digest=$(docker image inspect "${{ steps.image.outputs.image_reference }}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | head -n 1 || true)
          digest="${repo_digest##*@}"
          if [ -z "${digest}" ] || [ "${digest}" = "${repo_digest}" ]; then
            digest=$(docker manifest inspect --insecure "${{ steps.image.outputs.image_reference }}" | jq -r '.Descriptor.digest // .config.digest // empty')
          fi
          if [ -z "${digest}" ]; then
            echo "Unable to resolve pushed image digest for ${{ steps.image.outputs.image_reference }}" >&2
            exit 1
          fi
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
