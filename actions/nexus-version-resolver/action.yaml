name: Nexus Version Resolver
description: Produces controlled artifact version string.
inputs:
  application_name: { required: true }
  environment: { required: true }
  release_version: { required: true }
outputs:
  artifact_version:
    value: ${{ steps.version.outputs.artifact_version }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        short_sha="${GITHUB_SHA::7}"
        if [ "${{ inputs.environment }}" = "DEV" ]; then
          artifact_version="${{ inputs.application_name }}-DEV-${short_sha}-${GITHUB_RUN_NUMBER}"
        else
          artifact_version="${{ inputs.release_version }}"
        fi
        echo "artifact_version=${artifact_version}" >> "$GITHUB_OUTPUT"
